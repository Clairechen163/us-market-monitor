name: Pre-market Monitor

on:
  schedule:
    # Two triggers so one lands at ~08:55 ET in both summer (EDT, 12:55 UTC)
    # and winter (EST, 13:55 UTC); the other is skipped by --window below.
    # The snapshot scores bars through 08:30 ET; with the free Alpaca plan's
    # 15-minute delay those bars are complete from 08:46, hence the window.
    # (A late-starting 07:55 trigger used to slip in at 08:00 with partial data.)
    - cron: "55 12,13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-commit
  cancel-in-progress: false

jobs:
  premarket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-market snapshot
        env:
          # Optional: with these secrets set, pre-market data comes from Alpaca (includes volume).
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python premarket_monitor.py ${{ github.event_name == 'schedule' && '--window 08:46-09:45' || '' }}

      - name: Commit results
        run: |
          git config user.name  "Clairechen163"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add reports/premarket/ docs/premarket.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Pre-market signals for $(TZ=America/New_York date +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
